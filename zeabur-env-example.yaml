# Zeabur 环境变量配置文件 - 完善版
# ============================================
# 项目：WeCircle 社交媒体微服务
# 这些环境变量需要在 Zeabur 控制台中配置
# ============================================

# ============================================
# 基础配置
# ============================================

# 环境标识
ENV: prod

# 时区配置
TZ: Asia/Shanghai

# 日志级别：debug, info, warn, error
LOG_LEVEL: info

# ============================================
# 服务配置
# ============================================

# User Service 配置
SERVER_PORT: "8081"  # user-service 端口
USER_SERVICE_URL: http://user-service:8081

# Post Service 配置
POST_SERVICE_PORT: "8082"
POST_SERVICE_URL: http://post-service:8082

# ============================================
# 数据库配置
# ============================================

# 数据库 DSN（数据源名称）
# 方式1：SQLite 模式（默认，适合开发和小型部署）
DB_DSN: /app/dbs/prod/user_prod.db  # user-service
# DB_DSN: /app/dbs/prod/post_prod.db  # post-service

# 方式2：MySQL 模式（推荐生产环境）
# 当在 Zeabur 添加 MySQL 服务后，平台会自动注入以下变量：
# MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD, MYSQL_DATABASE
# 
# 然后需要手动设置 DB_DSN 为 MySQL 连接字符串格式：
# DB_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local
#
# 或者修改代码，让程序自动从这些环境变量构建 DSN

# MySQL 密码（如果使用 MySQL 服务，Zeabur 会自动设置）
# MYSQL_PASSWORD: ${MYSQL_PASSWORD}

# ============================================
# Redis 配置
# ============================================

# Redis 连接配置（Zeabur 会自动注入以下变量）
# REDIS_HOST: redis
# REDIS_PORT: "6379"
# REDIS_PASSWORD: ${REDIS_PASSWORD}

# Redis 配置选项
REDIS_ENABLED: "true"
REDIS_DB: "0"

# Redis 性能配置（可选）
# REDIS_POOL_SIZE: "10"
# REDIS_CACHE_TTL: "300"
# REDIS_MIN_IDLE_CONNS: "5"
# REDIS_MAX_RETRIES: "3"

# ============================================
# JWT 认证配置
# ============================================

# JWT 发行者
JWT_ISSUER: we-circle-prod

# JWT 算法
JWT_ALGORITHM: RS256

# JWT 过期时间（小时）
# JWT_EXPIRE_HOURS: "24"

# JWT 私钥（RSA Private Key PEM格式）
# 重要：需要在 Zeabur 控制台的 Environment Variables 中配置
# 
# 获取方式：
# 1. 在本地项目根目录，密钥文件为 private.pem 和 public.pem
# 2. 复制完整的 PEM 文件内容（包括 -----BEGIN/END----- 标记）
# 3. 在 Zeabur 控制台添加环境变量：
#    变量名：JWT_PRIVATE_KEY
#    变量值：粘贴 private.pem 的完整内容
#
# 命令获取私钥内容：cat private.pem | pbcopy  # macOS
# 命令获取私钥内容：cat private.pem | xclip -selection clipboard  # Linux
JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}

# JWT 公钥（RSA Public Key PEM格式）
# 重要：需要在 Zeabur 控制台的 Environment Variables 中配置
#
# 获取方式：
# 1. 在本地项目根目录，公钥文件为 public.pem
# 2. 复制完整的 PEM 文件内容（包括 -----BEGIN/END----- 标记）
# 3. 在 Zeabur 控制台添加环境变量：
#    变量名：JWT_PUBLIC_KEY
#    变量值：粘贴 public.pem 的完整内容
#
# 命令获取公钥内容：cat public.pem | pbcopy  # macOS
# 命令获取公钥内容：cat public.pem | xclip -selection clipboard  # Linux
JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}

# ============================================
# 安全配置
# ============================================

# CORS 配置（允许跨域的域名）
# CORS_ALLOWED_ORIGINS: https://*.zeabur.app,https://api.we-circle.com

# 是否允许凭据（cookies、认证头）
# CORS_ALLOW_CREDENTIALS: "true"

# 速率限制配置
# RATE_LIMIT_ENABLED: "true"
# RATE_LIMIT_REQUESTS: "100"
# RATE_LIMIT_WINDOW: "60"

# ============================================
# 监控和日志配置
# ============================================

# 日志输出格式：json, text
# LOG_FORMAT: json

# 是否开启 Prometheus 指标
# METRICS_ENABLED: "true"
# METRICS_PORT: "9090"

# ============================================
# 开发调试配置
# ============================================

# 调试模式（生产环境必须关闭）
# DEBUG: "false"

# Swagger 文档（生产环境建议关闭）
# SWAGGER_ENABLED: "false"

# SQL 日志（生产环境建议关闭）
# SQL_LOG_ENABLED: "false"

# ============================================
# Zeabur 部署说明
# ============================================
#
# 1. 在 Zeabur 控制台创建项目
# 2. 添加 MySQL 服务（可选，推荐生产环境）
# 3. 添加 Redis 服务
# 4. 导入 Git 仓库，Zeabur 会自动检测 zeabur.yaml 配置
# 5. 在项目设置 -> Environment Variables 中添加以下必需变量：
#    - JWT_PRIVATE_KEY: 粘贴 private.pem 的完整内容
#    - JWT_PUBLIC_KEY: 粘贴 public.pem 的完整内容
#    - DB_DSN: 根据使用的数据库类型设置（SQLite 或 MySQL）
# 6. 部署服务
#
# 注意事项：
# - JWT 密钥必须正确配置，否则认证功能无法工作
# - 确保 Redis 服务先于应用服务启动（已在 zeabur.yaml 中配置 dependsOn）
# - 服务间通信使用内部域名（如 http://user-service:8081）
# - Zeabur 会自动处理 HTTPS 证书和域名配置