basePath: /
definitions:
  handler.BatchGetUsersRequest:
    properties:
      user_ids:
        items:
          type: integer
        type: array
    required:
    - user_ids
    type: object
  handler.LoginRequest:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - phone
    - username
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: 用户服务API
  title: User Service API
  version: "2.0"
paths:
  /api/v1/users:
    get:
      description: 获取所有用户信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 获取所有用户
      tags:
      - users
  /api/v1/users/{user_id}:
    get:
      description: 根据用户ID获取用户信息
      parameters:
      - description: 用户ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 获取用户信息
      tags:
      - users
  /api/v1/users/{user_id}/posts:
    get:
      description: 根据用户ID获取用户信息和该用户发布的所有动态
      parameters:
      - description: 用户ID
        in: path
        name: user_id
        required: true
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 获取用户信息及其所有动态
      tags:
      - users
  /api/v1/users/batch:
    post:
      consumes:
      - application/json
      description: 批量获取用户信息（供服务间调用）
      parameters:
      - description: 用户ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.BatchGetUsersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 批量获取用户信息
      tags:
      - users
  /api/v1/users/login:
    post:
      consumes:
      - application/json
      description: 用户登录
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 用户登录
      tags:
      - users
  /api/v1/users/phone/{phone}:
    get:
      description: 根据手机号获取用户信息
      parameters:
      - description: 手机号
        in: path
        name: phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 根据手机号获取用户信息
      tags:
      - users
  /api/v1/users/register:
    post:
      consumes:
      - application/json
      description: 注册新用户
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 用户注册
      tags:
      - users
swagger: "2.0"
