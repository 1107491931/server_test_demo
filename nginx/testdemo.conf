# Test Demo - Microservices Multi Environment Nginx Configuration
# 
# Apple Silicon Mac (ARM64) 配置
# 配置文件位置：/opt/homebrew/etc/nginx/servers/testdemo.conf
#
# 微服务架构说明：
# - 用户服务 (user-service): 端口 8081
# - 动态服务 (post-service): 端口 8082
# 
# 通过 API 网关统一入口，根据路径路由到不同的微服务

# ============================================
# Upstream 定义 - 后端服务
# ============================================
upstream user_service {
    server 127.0.0.1:8081;
}

upstream post_service {
    server 127.0.0.1:8082;
}

# ============================================
# Map 定义 - 根据域名设置日志路径
# ============================================
map $server_name $access_log_path {
    api.staging.myapp.com  /opt/homebrew/var/log/nginx/testdemo_staging_access.log;
    api.pre.myapp.com      /opt/homebrew/var/log/nginx/testdemo_pre_access.log;
    api.prod.myapp.com     /opt/homebrew/var/log/nginx/testdemo_prod_access.log;
}

map $server_name $error_log_path {
    api.staging.myapp.com  /opt/homebrew/var/log/nginx/testdemo_staging_error.log;
    api.pre.myapp.com      /opt/homebrew/var/log/nginx/testdemo_pre_error.log;
    api.prod.myapp.com     /opt/homebrew/var/log/nginx/testdemo_prod_error.log;
}

# 是否启用 Swagger (只在 staging 环境启用)
map $server_name $enable_swagger {
    api.staging.myapp.com  1;
    default                0;
}

# ============================================
# 通用 Server 配置（所有环境共用）
# ============================================
server {
    listen 80;
    server_name api.staging.myapp.com api.pre.myapp.com api.prod.myapp.com;
    
    access_log $access_log_path;
    error_log $error_log_path;
    
    # 通用代理设置（所有 location 共用）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # 用户服务 API 路由
    location /api/v1/users {
        proxy_pass http://user_service;
    }
    
    # 动态服务路由
    location /api/v1/posts {
        proxy_pass http://post_service;
    }
    
    # Swagger 文档 (用户服务) - 仅 staging 环境
    location /user-swagger/ {
        if ($enable_swagger = 0) {
            return 404;
        }
        rewrite ^/user-swagger/(.*)$ /swagger/$1 break;
        proxy_pass http://user_service;
    }
    
    # Swagger 文档 (动态服务) - 仅 staging 环境
    location /post-swagger/ {
        if ($enable_swagger = 0) {
            return 404;
        }
        rewrite ^/post-swagger/(.*)$ /swagger/$1 break;
        proxy_pass http://post_service;
    }
    
    # 健康检查
    location /health {
        proxy_pass http://user_service/health;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
