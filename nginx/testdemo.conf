# Test Demo - Multi Environment Nginx Configuration
# 
# 使用说明：
# macOS: 复制到 /usr/local/etc/nginx/servers/testdemo.conf
# Linux: 复制到 /etc/nginx/conf.d/testdemo.conf
#
# 复制命令（macOS）：
# sudo cp nginx/testdemo.conf /usr/local/etc/nginx/servers/testdemo.conf
# sudo nginx -t
# sudo nginx -s reload

# Dev 环境
server {
    listen 80;
    server_name api.dev.myapp.com;
    
    # 访问日志（macOS路径，Linux请改为 /var/log/nginx/）
    access_log /usr/local/var/log/nginx/server_test_demo_dev_access.log;
    error_log /usr/local/var/log/nginx/server_test_demo_dev_error.log;
    
    location / {
        # 反向代理到 Docker 容器的 8081 端口
        proxy_pass http://127.0.0.1:8081;
        
        # 传递原始请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

