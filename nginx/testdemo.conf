# Test Demo - Microservices Multi Environment Nginx Configuration
# 
# Apple Silicon Mac (ARM64) 配置
# 配置文件位置：/opt/homebrew/etc/nginx/servers/testdemo.conf
#
# 微服务架构说明：
# - 用户服务 (user-service): 端口 8081
# - 动态服务 (post-service): 端口 8082
# 
# 通过 API 网关统一入口，根据路径路由到不同的微服务

# ============================================
# Staging 环境 - 开发环境
# ============================================
server {
    listen 80;
    server_name api.staging.myapp.com;
    
    access_log /opt/homebrew/var/log/nginx/testdemo_staging_access.log;
    error_log /opt/homebrew/var/log/nginx/testdemo_staging_error.log;
    
    # 用户服务 API 路由（/api/v1/users）
    location /api/v1/users {
        proxy_pass http://127.0.0.1:8081;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 动态服务路由
    location /api/v1/posts {
        proxy_pass http://127.0.0.1:8082;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8081/health;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}

