# Test Demo - Multi Environment Nginx Configuration
# 
# Apple Silicon Mac (ARM64) 配置
# 配置文件位置：/opt/homebrew/etc/nginx/servers/testdemo.conf
# 为方便配置，当前文件仅配置了http请求， 端口号80， 如果需要配置https请求， 需要配置443端口以及ssl证书(本地可以使用自签名证书)

# Dev 环境
server {
    listen 80;
    server_name api.dev.myapp.com;
    
    # 访问日志（Apple Silicon Mac 路径）
    access_log /opt/homebrew/var/log/nginx/server_test_demo_dev_access.log;
    error_log /opt/homebrew/var/log/nginx/server_test_demo_dev_error.log;
    
    location / {
        # 反向代理到 Docker 容器的 8081 端口
        proxy_pass http://127.0.0.1:8081;
        
        # 传递原始请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

